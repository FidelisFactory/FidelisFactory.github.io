# Checks the semester templates (and tests the proposal import) in every pull
# request. On every change to main, it publishes all templates as one file,
# which the apps download from
# https://www.fidelisfactory.ch/pluspoints/templates.json (GitHub Pages serves
# it from the fidelisfactory-website branch).
name: Templates

on:
  pull_request:
    paths:
      - "pluspoints/templates/**"
      - "scripts/**"
      - ".github/workflows/templates.yml"
      - ".github/workflows/import-proposals.yml"
  push:
    branches: [main]
    paths:
      - "pluspoints/templates/**"
      - "scripts/build_templates_bundle.py"
      - ".github/workflows/templates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the templates
        run: python3 scripts/build_templates_bundle.py
      - name: Test the proposal import
        run: python3 -m unittest discover -s scripts

  publish:
    # Only main is ever published: not a manual run on another branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: publish-templates
      cancel-in-progress: false
    steps:
      # The tip of main, not the commit that started the run: re-running an
      # old run must not publish templates that main has moved past.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          ref: fidelisfactory-website
          path: website
      - name: Build the template file
        # --previous keeps the published generatedAt when no template changed,
        # so the file stays byte-identical and nothing gets committed.
        run: >-
          python3 scripts/build_templates_bundle.py
          --previous website/pluspoints/templates.json
          --output website/pluspoints/templates.json
      - name: Commit it to the website branch
        id: commit
        working-directory: website
        run: |
          git add pluspoints/templates.json
          if git diff --cached --quiet; then
            echo "No template changed, so there is nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Publish the semester templates from $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          git push origin HEAD:fidelisfactory-website
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the website
        # A push made with the workflow's token may not start a Pages build on
        # its own, so ask for one. A manual run always asks, so it can repair
        # a run whose push worked but whose build request failed.
        if: steps.commit.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
